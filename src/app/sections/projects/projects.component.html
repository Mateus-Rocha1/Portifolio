<section class="projects">
  <h2 class="projects__title">PROJETOS</h2>

  <div class="projects__carousel">
    <button class="projects__arrow" (click)="anterior()" *ngIf="projetos.length > 1" aria-label="Projeto anterior">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="projects__card" *ngIf="projetos[indiceAtual] as p">
      <div class="projects__header">
        <h3>{{ p.nome }}</h3>
        <a [href]="p.githubUrl" target="_blank" aria-label="Ver no GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>

      <div class="projects__body">
        <p class="projects__descricao">{{ p.descricao }}</p>
        <img [src]="p.imagem" [alt]="p.nome" class="projects__imagem">
      </div>

      <div class="projects__badges">
        <span class="badge" *ngFor="let tec of p.tecnologias">{{ tec }}</span>
      </div>
    </div>

    <button class="projects__arrow" (click)="proximo()" *ngIf="projetos.length > 1" aria-label="Próximo projeto">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
</section>
