<section class="experience">
  <h2 class="experience__title">EXPERIÊNCIAS</h2>

  <div class="experience__list">
    <div class="experience__item" *ngFor="let exp of experiencias">
      <div class="experience__header">
        <h3>{{ exp.cargo }}</h3>
        <span class="experience__periodo">- {{ exp.periodo }}</span>
      </div>

      <div class="experience__local">
          {{ exp.local }}
      </div>

      <hr>

      <p class="experience__descricao">{{ exp.descricao }}</p>

      <div class="experience__historico" *ngIf="exp.historico">
        <strong>Histórico de projetos</strong>
        <ul>
          <li *ngFor="let h of exp.historico">
            <em>{{ h.cargo }} - {{ h.periodo }}</em>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
